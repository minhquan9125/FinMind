services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: finmind
      POSTGRES_PASSWORD: finmind
      POSTGRES_DB: finmind
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_postgres_schema.sql:/docker-entrypoint-initdb.d/01_init_postgres_schema.sql:ro
      - ./backend/scripts/init_pgvector.sql:/docker-entrypoint-initdb.d/02_init_pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finmind -d finmind"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    ports:
      - "7474:7474"   # Giao diện web trực quan Neo4j Browser
      - "7687:7687"   # Bolt protocol cho Backend kết nối
    environment:
      - NEO4J_AUTH=neo4j/finmind123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:

