<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu | FinMind Research Copilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { font-family: Inter, sans-serif; }</style>
</head>
<body class="min-h-screen bg-[#F8FAFC] text-[#0F172A] flex flex-col">
  <header class="w-full px-6 py-4 sm:px-8 border-b border-[#E2E8F0] bg-white">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-lg bg-[#2563EB] flex items-center justify-center text-white font-bold text-base shadow-sm tracking-tight">FM</div>
      <div class="flex flex-col">
        <span class="font-bold text-lg leading-tight">FinMind</span>
        <span class="text-[11px] text-[#64748B] -mt-0.5 font-medium">Research Copilot</span>
      </div>
    </div>
  </header>
  <main class="flex-1 flex items-center justify-center p-6 sm:p-10 lg:p-14">
    <section class="w-full max-w-md" aria-labelledby="page-title">
      <div class="bg-white rounded-2xl border border-[#E2E8F0] shadow-sm p-8">
        <div class="mb-8">
          <h1 id="page-title" class="text-2xl font-bold tracking-tight">Quên mật khẩu</h1>
          <p class="text-sm text-[#64748B] mt-2 leading-6">Nhập email tài khoản của bạn. FinMind sẽ gửi hướng dẫn đặt lại mật khẩu.</p>
        </div>
        <form class="space-y-5" id="recovery-form">
          <div>
            <label class="block text-sm font-medium mb-1.5" for="recovery-email">Email <span class="text-[#EF4444]">*</span></label>
            <input id="recovery-email" name="email" type="email" autocomplete="email" required placeholder="ten@congty.vn" class="w-full h-11 px-3.5 text-sm bg-white border border-[#CBD5E1] rounded-[10px] placeholder-[#94A3B8] focus:outline-none focus:ring-2 focus:ring-[#2563EB] focus:border-[#2563EB]">
          </div>
          <button type="submit" class="w-full h-11 min-h-[44px] px-5 bg-[#2563EB] hover:bg-[#1D4ED8] text-white font-medium text-sm rounded-[10px] shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#2563EB]">Gửi hướng dẫn đặt lại mật khẩu</button>
        </form>
        <p class="mt-6 pt-5 border-t border-[#E2E8F0] text-center text-sm text-[#64748B]">Nhớ mật khẩu? <a class="font-medium text-[#2563EB] hover:underline" href="../finmind_p02_ng_nh_p_b_n_tinh_ch_nh_chu_n_h_a/code.html">Đăng nhập</a></p>
      </div>
      <p class="text-center text-xs text-[#94A3B8] mt-6">Chỉ hỗ trợ mục đích nghiên cứu · Không phải khuyến nghị đầu tư</p>
    </section>
  </main>
  <script>
    document.getElementById('recovery-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const email = document.getElementById('recovery-email');
      if (!email.reportValidity()) return;
      window.location.assign('../finmind_p02_dat_lai_mat_khau_mau/code.html');
    });
  </script>
</body>
</html>
