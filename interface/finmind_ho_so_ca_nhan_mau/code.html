<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hồ sơ cá nhân | FinMind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #F8FAFC; color: #0F172A; font-family: Inter, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    header { background: #fff; border-bottom: 1px solid #E2E8F0; }
    header > div { display: flex; align-items: center; max-width: 1100px; height: 64px; margin: auto; padding: 0 32px; }
    header > div > div { display: flex; align-items: center; gap: 10px; }
    header > div > div > span:first-child { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; background: #2563EB; color: #fff; font-size: 12px; font-weight: 700; box-shadow: 0 1px 2px #0F172A18; }
    header > div > div > span:last-child { font-size: 18px; font-weight: 700; letter-spacing: -.025em; }
    main { max-width: 860px; margin: auto; padding: 48px 32px 64px; }
    #back-row { margin-bottom: 18px; }
    #back-home { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; margin-left: -6px; padding: 0 6px; border-radius: 6px; color: #64748B; font-size: 14px; font-weight: 600; text-decoration: none; }
    #back-home:hover { color: #0F172A; }
    #back-home:focus-visible { outline: 2px solid #2563EB; outline-offset: 2px; }
    #back-home svg { width: 16px; height: 16px; }
    .profile-intro { margin-bottom: 32px; }
    .profile-intro > p:first-child { margin: 0 0 8px; color: #64748B; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 32px; line-height: 1.2; letter-spacing: -.025em; }
    .profile-intro > p:last-child { margin: 10px 0 0; color: #64748B; font-size: 14px; line-height: 24px; }
    .profile-content { display: grid; gap: 20px; }
    section { padding: 32px; border: 1px solid #E2E8F0; border-radius: 16px; background: #fff; box-shadow: 0 1px 2px #0F172A0A; }
    section h2 { margin: 0; font-size: 18px; line-height: 26px; letter-spacing: -.015em; }
    section > div:first-child { margin-bottom: 24px; }
    section > div:first-child p { margin: 4px 0 0; color: #64748B; font-size: 14px; line-height: 22px; }
    #avatar-title + p { margin-top: 4px; }
    section[aria-labelledby="avatar-title"] > div:nth-of-type(2) { display: flex; align-items: center; gap: 24px; }
    section[aria-labelledby="avatar-title"] > div:nth-of-type(2) > div:first-child { position: relative; flex: none; width: 96px; height: 96px; }
    #avatar-preview { display: flex; align-items: center; justify-content: center; width: 96px; height: 96px; overflow: hidden; border: 4px solid #fff; border-radius: 50%; background: #DBEAFE; color: #1D4ED8; font-size: 24px; font-weight: 600; box-shadow: 0 0 0 1px #BFDBFE; }
    #avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
    #avatar-preview + span { position: absolute; right: -4px; bottom: -4px; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 2px solid #fff; border-radius: 50%; background: #EFF6FF; color: #2563EB; box-shadow: 0 1px 3px #0F172A18; }
    #avatar-preview + span svg, label[for="avatar-input"] svg { width: 18px; height: 18px; }
    label[for="avatar-input"] { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 1px solid #CBD5E1; border-radius: 10px; background: #fff; cursor: pointer; font-size: 14px; font-weight: 600; }
    label[for="avatar-input"]:hover { background: #F8FAFC; }
    label[for="avatar-input"]:focus-within { outline: 2px solid #2563EB; outline-offset: 2px; }
    #avatar-input { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    #avatar-help { margin: 8px 0 0; color: #64748B; font-size: 12px; line-height: 20px; }
    #avatar-feedback, #password-feedback { margin: 12px 0 0; font-size: 12px; font-weight: 600; }
    .hidden { display: none; }
    section[aria-labelledby="avatar-title"] > div:last-child, #password-form > div:last-child { display: flex; justify-content: flex-end; margin-top: 28px; padding-top: 20px; border-top: 1px solid #F1F5F9; }
    button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 10px; background: #2563EB; color: #fff; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 600; }
    button:hover { background: #1D4ED8; }
    button:focus-visible { outline: 2px solid #2563EB; outline-offset: 2px; }
    button:disabled { background: #CBD5E1; cursor: not-allowed; }
    #password-form { max-width: 520px; }
    #password-form > div:first-child { display: grid; grid-template-columns: 1fr; gap: 20px; }
    #password-form > div:last-child { justify-content: flex-start; margin-top: 24px; padding-top: 0; border-top: 0; }
    #password-form label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 600; }
    #password-form input { display: block; width: 100%; height: 44px; padding: 0 14px; border: 1px solid #CBD5E1; border-radius: 10px; outline: none; background: #fff; color: #0F172A; font: inherit; font-size: 14px; }
    #password-form input:focus { border-color: #2563EB; box-shadow: 0 0 0 3px #DBEAFE; }
    main > p:last-child { margin: 24px 0 0; color: #94A3B8; font-size: 12px; text-align: center; }
    @media(max-width:640px) { header > div { padding: 0 20px; } main { padding: 36px 20px 48px; } h1 { font-size: 28px; } section { padding: 24px; } section[aria-labelledby="avatar-title"] > div:nth-of-type(2) { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body class="min-h-screen bg-[#F8FAFC] text-[#0F172A] antialiased">
  <header class="border-b border-[#E2E8F0] bg-white">
    <div class="mx-auto flex h-16 max-w-[1100px] items-center px-5 sm:px-8">
      <div class="flex items-center gap-2.5" aria-label="FinMind">
        <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-[#2563EB] text-xs font-bold tracking-tight text-white shadow-sm">FM</span>
        <span class="text-lg font-bold tracking-tight">FinMind</span>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-[860px] px-5 pb-16 pt-9 sm:px-8 sm:pt-12">
    <div id="back-row"><a id="back-home" href="../finmind_dashboard_nghi_n_c_u_ng_b_watchlist_linh_ho_t/code.html"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12 6 8l4-4"/></svg>Về trang chủ</a></div>
    <div class="profile-intro mb-8">
      <p class="mb-2 text-xs font-semibold uppercase tracking-[0.12em] text-[#64748B]">Tài khoản</p>
      <h1 class="text-[28px] font-bold tracking-tight sm:text-[32px]">Hồ sơ cá nhân</h1>
      <p class="mt-2 text-sm leading-6 text-[#64748B]">Đổi ảnh đại diện và mật khẩu của bạn.</p>
    </div>

    <div class="profile-content space-y-5">
      <section class="rounded-2xl border border-[#E2E8F0] bg-white p-6 shadow-sm sm:p-8" aria-labelledby="avatar-title">
        <div class="mb-6">
          <h2 id="avatar-title" class="text-lg font-semibold tracking-tight">Ảnh đại diện</h2>
          <p class="mt-1 text-sm text-[#64748B]">Chọn ảnh để xem trước diện mạo mới.</p>
        </div>
        <div class="flex flex-col gap-6 sm:flex-row sm:items-center">
          <div class="relative h-24 w-24 shrink-0">
            <div id="avatar-preview" class="flex h-24 w-24 items-center justify-center overflow-hidden rounded-full border-4 border-white bg-[#DBEAFE] text-2xl font-semibold text-[#1D4ED8] shadow-[0_0_0_1px_#BFDBFE]" aria-label="Ảnh đại diện xem trước">NA</div>
            <span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h4l2-2h6l2 2h4v12H3z"/><circle cx="12" cy="13" r="3"/></svg></span>
          </div>
          <div class="min-w-0 flex-1">
            <label for="avatar-input" class="inline-flex min-h-11 cursor-pointer items-center justify-center gap-2 rounded-[10px] border border-[#CBD5E1] bg-white px-4 text-sm font-medium text-[#0F172A] transition-colors hover:bg-[#F8FAFC] focus-within:ring-2 focus-within:ring-[#2563EB]">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m-4 4 4-4 4 4M4 16v4h16v-4"/></svg>
              Chọn ảnh mới
            </label>
            <input id="avatar-input" class="sr-only" type="file" accept="image/png,image/jpeg" aria-describedby="avatar-help avatar-feedback">
            <p id="avatar-help" class="mt-2 text-xs leading-5 text-[#64748B]">PNG hoặc JPG, tối đa 2 MB.</p>
            <p id="avatar-feedback" class="mt-2 hidden text-xs font-medium" role="status" aria-live="polite"></p>
          </div>
        </div>
        <div class="mt-7 flex justify-end border-t border-[#F1F5F9] pt-5">
          <button id="save-avatar" type="button" disabled class="min-h-11 rounded-[10px] bg-[#2563EB] px-5 text-sm font-semibold text-white transition-colors hover:bg-[#1D4ED8] disabled:cursor-not-allowed disabled:bg-[#CBD5E1]">Lưu ảnh đại diện</button>
        </div>
      </section>

      <section class="rounded-2xl border border-[#E2E8F0] bg-white p-6 shadow-sm sm:p-8" aria-labelledby="password-title">
        <div class="mb-6">
          <h2 id="password-title" class="text-lg font-semibold tracking-tight">Đổi mật khẩu</h2>
          <p class="mt-1 text-sm text-[#64748B]">Nhập mật khẩu hiện tại và mật khẩu mới.</p>
        </div>
        <form id="password-form" novalidate>
          <div class="grid gap-5 sm:grid-cols-2">
            <div class="sm:col-span-2">
              <label for="current-password" class="mb-1.5 block text-sm font-medium">Mật khẩu hiện tại</label>
              <input id="current-password" type="password" autocomplete="current-password" required class="h-11 w-full rounded-[10px] border border-[#CBD5E1] bg-white px-3.5 text-sm outline-none transition-shadow focus:border-[#2563EB] focus:ring-2 focus:ring-[#DBEAFE] sm:max-w-[360px]">
            </div>
            <div>
              <label for="new-password" class="mb-1.5 block text-sm font-medium">Mật khẩu mới</label>
              <input id="new-password" type="password" autocomplete="new-password" required class="h-11 w-full rounded-[10px] border border-[#CBD5E1] bg-white px-3.5 text-sm outline-none transition-shadow focus:border-[#2563EB] focus:ring-2 focus:ring-[#DBEAFE]">
            </div>
            <div>
              <label for="confirm-password" class="mb-1.5 block text-sm font-medium">Xác nhận mật khẩu mới</label>
              <input id="confirm-password" type="password" autocomplete="new-password" required class="h-11 w-full rounded-[10px] border border-[#CBD5E1] bg-white px-3.5 text-sm outline-none transition-shadow focus:border-[#2563EB] focus:ring-2 focus:ring-[#DBEAFE]">
            </div>
          </div>
          <p id="password-feedback" class="mt-4 hidden text-xs font-medium" role="status" aria-live="polite"></p>
          <div class="mt-7 flex justify-end border-t border-[#F1F5F9] pt-5">
            <button type="submit" class="min-h-11 rounded-[10px] bg-[#2563EB] px-5 text-sm font-semibold text-white transition-colors hover:bg-[#1D4ED8] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#2563EB]">Đổi mật khẩu</button>
          </div>
        </form>
      </section>
    </div>
    <p class="mt-6 text-center text-xs text-[#94A3B8]">Bản mẫu giao diện · Thay đổi chưa được lưu vào tài khoản.</p>
  </main>

  <script>
    const avatarInput = document.getElementById('avatar-input');
    const avatarPreview = document.getElementById('avatar-preview');
    const avatarFeedback = document.getElementById('avatar-feedback');
    const saveAvatar = document.getElementById('save-avatar');
    const passwordForm = document.getElementById('password-form');
    const passwordFeedback = document.getElementById('password-feedback');
    let previewUrl = null;

    function feedback(element, message, error = false) {
      element.textContent = message;
      element.className = '';
      element.style.color = error ? '#DC2626' : '#2563EB';
    }

    avatarInput.addEventListener('change', () => {
      const file = avatarInput.files?.[0];
      if (!file) return;
      if (!['image/png', 'image/jpeg'].includes(file.type) || file.size > 2 * 1024 * 1024) {
        feedback(avatarFeedback, 'Vui lòng chọn ảnh PNG hoặc JPG không quá 2 MB.', true);
        avatarInput.value = '';
        saveAvatar.disabled = true;
        return;
      }
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(file);
      avatarPreview.textContent = '';
      const image = document.createElement('img');
      image.src = previewUrl;
      image.alt = 'Ảnh đại diện mới';
      image.className = 'h-full w-full object-cover';
      avatarPreview.appendChild(image);
      saveAvatar.disabled = false;
      feedback(avatarFeedback, 'Ảnh mới đã sẵn sàng để xem trước.');
    });

    saveAvatar.addEventListener('click', () => {
      feedback(avatarFeedback, 'Bản mẫu: ảnh chỉ được xem trước, chưa lưu vào tài khoản.');
    });

    passwordForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const current = document.getElementById('current-password');
      const next = document.getElementById('new-password');
      const confirm = document.getElementById('confirm-password');
      if (!current.value || !next.value || !confirm.value) {
        feedback(passwordFeedback, 'Vui lòng nhập đầy đủ ba ô mật khẩu.', true);
        (!current.value ? current : !next.value ? next : confirm).focus();
        return;
      }
      if (next.value !== confirm.value) {
        feedback(passwordFeedback, 'Mật khẩu xác nhận chưa khớp.', true);
        confirm.focus();
        return;
      }
      passwordForm.reset();
      feedback(passwordFeedback, 'Bản mẫu: biểu mẫu hợp lệ, mật khẩu chưa được thay đổi.');
    });
  </script>
</body>
</html>
